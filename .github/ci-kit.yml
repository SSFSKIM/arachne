# ci-kit gates. Schema: https://github.com/SSFSKIM/ci-kit/blob/main/docs/adopting.md
#
# The environment mirrors the CI the code was forked with: Cairo built at the version the
# control frames were rendered with (.github/ci-setup.sh) and TeX for the Tex mobjects. Each
# gate picks its Python with UV_PYTHON.
version: 1
setup:
  apt:
    - libpango1.0-dev
    - pkg-config
    - fonts-noto-core
    - fonts-noto-cjk
    - fonts-open-sans
    - texlive-latex-base
    - texlive-latex-recommended
    - texlive-latex-extra
    - texlive-fonts-recommended
    - texlive-fonts-extra
    - texlive-science
    - texlive-xetex
    - texlive-lang-greek
    - texlive-lang-chinese
    - cm-super
    - lmodern
    - dvisvgm
    - tipa
  script: .github/ci-setup.sh
  install: pipx install uv==0.12.3 && uv sync --all-extras --locked
gates:
  - name: tests-py312
    run: uv run python -m pytest --ignore=tests/test_docs_examples
    env: {UV_PYTHON: "3.12"}
    timeout: 45
  # Ubuntu 24.04's system Python. Code positions differ between 3.12 patch releases (3.12.3
  # places a lambda's implicit return at column 0), and the timeline reads them.
  - name: tests-py3123
    run: uv run python -m pytest --ignore=tests/test_docs_examples
    env: {UV_PYTHON: "3.12.3"}
    timeout: 45
  - name: tests-py314
    run: uv run python -m pytest --ignore=tests/test_docs_examples
    env: {UV_PYTHON: "3.14"}
    timeout: 45
  - name: docs-examples
    run: uv run python -m pytest tests/test_docs_examples --dist=load --no-cov
    # One BLAS kernel and one thread, whatever the runner's CPU: an eigenvector in a
    # degenerate eigenspace (a symmetric graph's spectral layout) follows the kernel.
    env: {UV_PYTHON: "3.14", OPENBLAS_CORETYPE: Haswell, OPENBLAS_NUM_THREADS: "1"}
    timeout: 45
  - name: macos
    lane: hosted-macos
    run: uv run python -m pytest --ignore=tests/test_docs_examples
    env: {UV_PYTHON: "3.14"}
    timeout: 60
  - name: doctest
    run: |
      uv run python -m pytest -v --no-cov --doctest-modules arachne
      cd docs && uv run make doctest O=-tskip-manim
    env: {UV_PYTHON: "3.14"}
  - name: lint
    setup: false
    run: pipx run pre-commit run --all-files --show-diff-on-failure

  # The core (core/, the arachne-core crate and its Python binding): CPU only, and the same bytes
  # on every machine. These gates set up their own toolchain (core/rust-toolchain.toml) and run
  # only when the core or this file changes.
  - name: core-lint
    setup: false
    paths: ["core/**", ".github/ci-kit.yml"]
    run: bash core/ci/lint.sh
    timeout: 20
  - name: core-test
    setup: false
    paths: ["core/**", ".github/ci-kit.yml"]
    run: bash core/ci/test.sh
    timeout: 20
  - name: core-binding
    setup: false
    paths: ["core/**", ".github/ci-kit.yml"]
    run: bash core/ci/binding.sh 3.12 3.14
    timeout: 20
  - name: core-identity
    setup: false
    paths: ["core/**", ".github/ci-kit.yml"]
    run: bash core/ci/identity.sh
    timeout: 20
  - name: core-macos
    lane: hosted-macos
    setup: false
    paths: ["core/**", ".github/ci-kit.yml"]
    run: bash core/ci/test.sh && bash core/ci/binding.sh 3.14
    timeout: 30

  # Scratch (never lands): C5.3 frame identity measured against 3ce63425.
  - name: c53-measure
    run: bash .github/c53/measure.sh
    env: {UV_PYTHON: "3.12"}
    timeout: 45
