# ci-kit gates. Schema: https://github.com/SSFSKIM/ci-kit/blob/main/docs/adopting.md
#
# The environment mirrors the CI the code was forked with: Cairo built at the version the
# control frames were rendered with (.github/ci-setup.sh) and TeX for the Tex mobjects. Each
# gate picks its Python with UV_PYTHON.
version: 1
setup:
  apt:
    - libpango1.0-dev
    - pkg-config
    - fonts-noto-core
    - fonts-noto-cjk
    - fonts-open-sans
    - texlive-latex-base
    - texlive-latex-recommended
    - texlive-latex-extra
    - texlive-fonts-recommended
    - texlive-fonts-extra
    - texlive-science
    - texlive-xetex
    - texlive-lang-greek
    - texlive-lang-chinese
    - cm-super
    - lmodern
    - dvisvgm
    - tipa
  script: .github/ci-setup.sh
  install: pipx install uv==0.12.3 && uv sync --all-extras --locked
gates:
  - name: tests-py312
    run: uv run python -m pytest --ignore=tests/test_docs_examples
    env: {UV_PYTHON: "3.12"}
    timeout: 45
  # Ubuntu 24.04's system Python. Code positions differ between 3.12 patch releases (3.12.3
  # places a lambda's implicit return at column 0), and the timeline reads them.
  - name: tests-py3123
    run: uv run python -m pytest --ignore=tests/test_docs_examples
    env: {UV_PYTHON: "3.12.3"}
    timeout: 45
  - name: tests-py314
    run: uv run python -m pytest --ignore=tests/test_docs_examples
    env: {UV_PYTHON: "3.14"}
    timeout: 45
  - name: docs-examples
    run: uv run python -m pytest tests/test_docs_examples --dist=load --no-cov
    # One BLAS kernel and one thread, whatever the runner's CPU: an eigenvector in a
    # degenerate eigenspace (a symmetric graph's spectral layout) follows the kernel.
    env: {UV_PYTHON: "3.14", OPENBLAS_CORETYPE: Haswell, OPENBLAS_NUM_THREADS: "1"}
    timeout: 45
  - name: macos
    lane: hosted-macos
    # GitHub runs five hosted macOS jobs at a time for the whole account, shared with the account's other
    # repositories, so a ci-gate push does not start this one: the pull request's run carries it, and
    # `ci-gate --gates macos` runs it by name.
    on: [pr, dispatch]
    run: uv run python -m pytest --ignore=tests/test_docs_examples
    env: {UV_PYTHON: "3.14"}
    timeout: 60
  - name: doctest
    run: |
      uv run python -m pytest -v --no-cov --doctest-modules arachne
      cd docs && uv run make doctest O=-tskip-manim
    env: {UV_PYTHON: "3.14"}
  - name: lint
    setup: false
    run: pipx run pre-commit run --all-files --show-diff-on-failure

  # The core (core/, the arachne-core crate and its Python binding): CPU only, and the same bytes
  # on every machine. These gates set up their own toolchain (core/rust-toolchain.toml) and run
  # only when the core or this file changes.
  - name: core-lint
    setup: false
    paths: ["core/**", ".github/ci-kit.yml"]
    run: bash core/ci/lint.sh
    timeout: 20
  - name: core-test
    setup: false
    paths: ["core/**", ".github/ci-kit.yml"]
    run: bash core/ci/test.sh
    timeout: 20
  - name: core-binding
    setup: false
    paths: ["core/**", ".github/ci-kit.yml"]
    run: bash core/ci/binding.sh 3.12 3.14
    timeout: 20
  - name: core-identity
    setup: false
    paths: ["core/**", ".github/ci-kit.yml"]
    run: bash core/ci/identity.sh
    timeout: 20
  - name: core-macos
    lane: hosted-macos
    # GitHub runs five hosted macOS jobs at a time for the whole account, shared with the account's other
    # repositories, so a ci-gate push does not start this one: the pull request's run carries it, and
    # `ci-gate --gates core-macos` runs it by name.
    on: [pr, dispatch]
    setup: false
    paths: ["core/**", ".github/ci-kit.yml"]
    run: bash core/ci/test.sh && bash core/ci/binding.sh 3.14
    timeout: 30

  # The comparator (compare/, the arachne-compare distribution): its built wheel's tests, run
  # outside the checkout, where arachne is not importable and no root options apply.
  - name: compare
    setup: false
    paths: ["compare/**", ".github/ci-kit.yml"]
    timeout: 10
    run: |
      set -euo pipefail
      command -v uv >/dev/null || pipx install uv==0.12.3
      work=$(mktemp -d)
      uv build --wheel --out-dir "$work/wheels" compare
      uv venv --quiet --python 3.12 "$work/venv"
      VIRTUAL_ENV="$work/venv" uv pip install --quiet "$work"/wheels/arachne_compare-*.whl pytest
      cp -R compare/tests "$work/tests"
      cd "$work"
      venv/bin/python -c "import importlib.util as u, arachne_compare; assert u.find_spec('arachne') is None"
      venv/bin/python -m pytest -q -p no:cacheprovider tests

  # The GPU build (gpu/, the arachne-gpu crate and its Python binding): a build of its own, never
  # an extra of the engine. Its drawing tests run on a software adapter (lavapipe) that each gate
  # installs itself. gpu-binding and cpu-bytes run on every pull request, whatever it changes:
  # cpu-bytes shows that a scene using nothing new draws the same bytes with the GPU build
  # installed and without it.
  - name: gpu-lint
    setup: false
    paths: ["gpu/**", ".github/ci-kit.yml"]
    run: bash gpu/ci/lint.sh
    timeout: 20
  - name: gpu-test
    setup: false
    paths: ["gpu/**", ".github/ci-kit.yml"]
    run: bash gpu/ci/test.sh
    timeout: 30
  - name: gpu-binding
    run: bash gpu/ci/binding.sh gpu/tests/python
    env: {UV_PYTHON: "3.12"}
    timeout: 30
  - name: cpu-bytes
    run: bash gpu/ci/cpu_bytes.sh
    env: {UV_PYTHON: "3.12"}
    timeout: 45
