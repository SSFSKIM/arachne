# ci-kit gates. Schema: https://github.com/SSFSKIM/ci-kit/blob/main/docs/adopting.md
#
# The environment mirrors the CI the code was forked with: Cairo built at the version the
# control frames were rendered with (.github/ci-setup.sh), TeX for the Tex mobjects, and on
# Linux a virtual display for the OpenGL tests, drawn by Mesa's softpipe: the runner's llvmpipe
# crashes in them. Each gate picks its Python with UV_PYTHON.
version: 1
setup:
  apt:
    - libpango1.0-dev
    - pkg-config
    - python3-opengl
    - freeglut3-dev
    - xvfb
    - fonts-noto-core
    - fonts-noto-cjk
    - fonts-open-sans
    - texlive-latex-base
    - texlive-latex-recommended
    - texlive-latex-extra
    - texlive-fonts-recommended
    - texlive-fonts-extra
    - texlive-science
    - texlive-xetex
    - texlive-lang-greek
    - texlive-lang-chinese
    - cm-super
    - lmodern
    - dvisvgm
    - tipa
  script: .github/ci-setup.sh
  install: pipx install uv==0.12.3 && uv sync --all-extras --locked
gates:
  - name: tests-py312
    run: xvfb-run -a -s "-screen 0 1280x1024x24" uv run python -m pytest --ignore=tests/test_docs_examples
    env: {UV_PYTHON: "3.12", GALLIUM_DRIVER: softpipe}
    timeout: 45
  - name: tests-py314
    run: xvfb-run -a -s "-screen 0 1280x1024x24" uv run python -m pytest --ignore=tests/test_docs_examples
    env: {UV_PYTHON: "3.14", GALLIUM_DRIVER: softpipe}
    timeout: 45
  - name: docs-examples
    run: xvfb-run -a -s "-screen 0 1280x1024x24" uv run python -m pytest tests/test_docs_examples --dist=load --no-cov
    # One BLAS kernel and one thread, whatever the runner's CPU: an eigenvector in a
    # degenerate eigenspace (a symmetric graph's spectral layout) follows the kernel.
    env: {UV_PYTHON: "3.14", GALLIUM_DRIVER: softpipe, OPENBLAS_CORETYPE: Haswell, OPENBLAS_NUM_THREADS: "1"}
    timeout: 45
  - name: macos
    lane: hosted-macos
    run: uv run python -m pytest --ignore=tests/test_docs_examples
    env: {UV_PYTHON: "3.14"}
    timeout: 60
  - name: doctest
    run: |
      uv run python -m pytest -v --no-cov --ignore-glob="*opengl*" --doctest-modules manim
      cd docs && uv run make doctest O=-tskip-manim
    env: {UV_PYTHON: "3.14"}
  - name: lint
    setup: false
    run: pipx run pre-commit run --all-files --show-diff-on-failure
