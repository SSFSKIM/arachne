name: ci
on:
  pull_request:
  push:
    branches: ['ci/**', main]
  schedule:
    - cron: '23 0 * * 1'
    - cron: '47 6 * * 1'
  workflow_dispatch:
    inputs:
      gates: {description: 'comma list of gate names; empty = all', required: false, default: ''}
jobs:
  ci:
    uses: SSFSKIM/ci-kit/.github/workflows/gates.yml@v1
    secrets: inherit
