# arachne.cfg
# Default configuration for manim

# Configure how manim behaves when called from the command line without
# specifying any flags
[CLI]

# CLI values override the settings found here. Optional CLI flags preserve
# configured values when they are not explicitly passed.

# --notify_outdated_version
notify_outdated_version = True

# Primary output format. "auto" resolves to mp4 for opaque scenes and mov for
# transparent scenes. Use "none" to disable media output.
format = auto

# -a, --write_all
write_all = False

# -0, --zero_pad
zero_pad = 4

# --save_sections
save_sections = False

# -p, --preview: open the completed artifact after rendering
preview = False

# -l, --live-preview: display frames while rendering when supported
live_preview = False

# --show_in_file_browser
show_in_file_browser = False

# -v, --verbosity
verbosity = INFO

# --progress_bar
progress_bar = display

# -o, --output_file
output_file =

# --log_to_file
log_to_file = False

# -c, --background_color
background_color = BLACK

# --background_opacity
background_opacity = 1

# The following two are both set by the -n (or --from_animation_number)
# flag.  See arachne -h for more information.
from_animation_number = 0

# Use -1 to render all animations
upto_animation_number = -1

# The following are meant to be paths relative to the point of execution.
# Set them at the CLI with the corresponding flag, or set their default
# values here.

# --media_dir
media_dir = ./media

# --log_dir
log_dir = {media_dir}/logs

# --assets_dir
assets_dir = ./

# the following do not have CLI arguments but depend on media_dir
video_dir = {media_dir}/videos/{module_name}/{quality}
sections_dir = {video_dir}/sections
images_dir = {media_dir}/images/{module_name}
tex_dir = {media_dir}/Tex
text_dir = {media_dir}/texts
partial_movie_dir = {video_dir}/partial_movie_files/{scene_name}

# Maximum number of partial movie files being encoded concurrently while the
# scene continues rendering. 1 encodes each animation's file before the next
# animation starts; values > 1 overlap encoding with rendering (bounds pipeline
# depth, not CPU use; each encoder already slice-threads internally).
# 4 is a good value on typical hardware.
max_inflight_encoders = 1

# Maximum number of pending frame buffers held by each encoder. Rendering
# blocks when the queue is full, which bounds the memory used by frames
# waiting to be encoded.
encoder_queue_size = 8

# These now override the --quality option.
frame_rate = 60
pixel_height = 1080
pixel_width = 1920

# Use -1 to keep an unlimited number of cached segment files.
max_files_cached = 100
disable_caching = False
# Disable the warning when there are too much submobjects to hash.
disable_caching_warning = False

# --dry_run
dry_run = False

# Paint a play's static mobjects once and reuse the picture while they are
# unchanged. False draws them in every frame: the same frames, slower.
static_layer = True

# How a frame becomes pixels: cairo draws the shown mobjects directly;
# ir_cairo describes the frame in XF, the Frame IR, and draws it with Cairo
# from that description alone (a check that the IR is complete).
draw_path = cairo

# The speed levers: each changes how fast a render is made, never what it
# shows. --speed-levers/--no-speed-levers: off, every lever below reads as
# its Manim CE-style setting (off, 1 worker, no typesetting directory),
# whatever it is set to here.
speed_levers = True

# --vectorize-trusted: compute a trusted play's values for all its instants
# at once, the same values bit for bit.
vectorize_trusted = True

# --construction-memo: text and number construction reuse what an equal
# construction built, exactly as it would be built afresh.
construction_memo = True

# --fast-copy: a mobject's deep copy is made by Arachne's own copier, the
# same copy that copy.deepcopy makes.
fast_copy = True

# --draw-reuse: a frame whose recorded state is the previous frame's reuses
# its pixels.
draw_reuse = True

# --hold-gaps: write a run of equal frames to a video as one frame lasting
# the run (variable frame rate; the same frames on the frame grid).
hold_gaps = False

# --workers: how many processes draw and encode a render; "auto" is the
# number of processors this process may run on.
render_workers = 1

# --typeset_dir (or ARACHNE_TYPESET_DIR, which outranks this file): where
# typeset Tex and Text are kept and shared across scenes, renders and
# processes. Empty: each is typeset into tex_dir and text_dir.
typeset_dir =

# Default tex_template
# --tex_template
tex_template =

# specify the plugins as comma separated values
# manim will load that plugin if it specified here.
plugins =

# CLI Context/Formatter
# Visit the cloup documentation to understand the formatting options available:
# https://cloup.readthedocs.io/en/latest/index.html#a-simple-example
[CLI_CTX]
# CTX settings
align_option_groups = True
align_sections = True
show_constraints = True

# Formatter settings
indent_increment = 2
width = 80
col1_max_width = 30
col2_min_width = 35
col_spacing = 2
row_sep =

# Dark/Light, or leave empty
theme =

# Theme Settings - The following options override the theme colors.
command_help =
invoked_command =
heading =
constraint =
section_help =
col1 =
col2 =
epilog =

# Rich settings
[logger]
logging_keyword = bold yellow
logging_level_notset = dim
logging_level_debug = green
logging_level_info = green
logging_level_warning = red
logging_level_error = red bold
logging_level_critical = red bold reverse
log_level =
log_time = cyan dim
log_message =
log_path = dim
log_width = -1
log_height = -1
log_timestamps = True
repr_number = green

[video_encoder]
# Cached video-segment encoder. "auto" selects a codec and pixel format from
# the requested output format and alpha requirement.
codec = auto
pixel_format = auto

[video_encoder.options]
# Arbitrary codec key/value options can be added here, for example:
# crf = 18
# preset = slow

[media]
# Logging level for media encoding, decoding, filtering, and muxing.
loglevel = ERROR

[jupyter]
media_embed = False
media_width = 60%%
