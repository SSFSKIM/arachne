# The oracle's plants: each removes one check from the oracle's source, and names the tests
# that must fail without it. core/ci/oracle_plants.py applies each in turn and restores the
# source; nothing here is built. `item` is XF.md's apply check ("Where each check is made"),
# or the contract section the check serves; `find` occurs exactly once in `file`.

