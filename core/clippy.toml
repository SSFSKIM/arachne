# The core's output may not depend on the machine: no fused multiply-add the compiler may or may not
# emit, and transcendental functions from the pure-Rust `libm` crate, never the platform's (whose
# implementations differ between systems and, in glibc, between CPUs). `sqrt`, `abs`, `floor` and the
# like are exact IEEE operations and stay allowed. The f64 and f32 lists name the same methods.
disallowed-methods = [
    { path = "f64::mul_add", reason = "fused or not depends on the target; write a * b + c" },
    { path = "f64::sin", reason = "use libm::sin" },
    { path = "f64::cos", reason = "use libm::cos" },
    { path = "f64::sin_cos", reason = "use libm::sin and libm::cos" },
    { path = "f64::tan", reason = "use libm::tan" },
    { path = "f64::asin", reason = "use libm::asin" },
    { path = "f64::acos", reason = "use libm::acos" },
    { path = "f64::atan", reason = "use libm::atan" },
    { path = "f64::atan2", reason = "use libm::atan2" },
    { path = "f64::exp", reason = "use libm::exp" },
    { path = "f64::exp2", reason = "use libm::exp2" },
    { path = "f64::exp_m1", reason = "use libm::expm1" },
    { path = "f64::ln", reason = "use libm::log" },
    { path = "f64::ln_1p", reason = "use libm::log1p" },
    { path = "f64::log", reason = "use libm" },
    { path = "f64::log2", reason = "use libm::log2" },
    { path = "f64::log10", reason = "use libm::log10" },
    { path = "f64::powf", reason = "use libm::pow" },
    { path = "f64::powi", reason = "its expansion depends on the compiler; multiply explicitly" },
    { path = "f64::cbrt", reason = "use libm::cbrt" },
    { path = "f64::hypot", reason = "use libm::hypot" },
    { path = "f64::sinh", reason = "use libm::sinh" },
    { path = "f64::cosh", reason = "use libm::cosh" },
    { path = "f64::tanh", reason = "use libm::tanh" },
    { path = "f64::asinh", reason = "use libm::asinh" },
    { path = "f64::acosh", reason = "use libm::acosh" },
    { path = "f64::atanh", reason = "use libm::atanh" },
    { path = "f32::mul_add", reason = "fused or not depends on the target; write a * b + c" },
    { path = "f32::sin", reason = "use libm::sinf" },
    { path = "f32::cos", reason = "use libm::cosf" },
    { path = "f32::sin_cos", reason = "use libm::sinf and libm::cosf" },
    { path = "f32::tan", reason = "use libm::tanf" },
    { path = "f32::asin", reason = "use libm::asinf" },
    { path = "f32::acos", reason = "use libm::acosf" },
    { path = "f32::atan", reason = "use libm::atanf" },
    { path = "f32::atan2", reason = "use libm::atan2f" },
    { path = "f32::exp", reason = "use libm::expf" },
    { path = "f32::exp2", reason = "use libm::exp2f" },
    { path = "f32::exp_m1", reason = "use libm::expm1f" },
    { path = "f32::ln", reason = "use libm::logf" },
    { path = "f32::ln_1p", reason = "use libm::log1pf" },
    { path = "f32::log", reason = "use libm" },
    { path = "f32::log2", reason = "use libm::log2f" },
    { path = "f32::log10", reason = "use libm::log10f" },
    { path = "f32::powf", reason = "use libm::powf" },
    { path = "f32::powi", reason = "its expansion depends on the compiler; multiply explicitly" },
    { path = "f32::cbrt", reason = "use libm::cbrtf" },
    { path = "f32::hypot", reason = "use libm::hypotf" },
    { path = "f32::sinh", reason = "use libm::sinhf" },
    { path = "f32::cosh", reason = "use libm::coshf" },
    { path = "f32::tanh", reason = "use libm::tanhf" },
    { path = "f32::asinh", reason = "use libm::asinhf" },
    { path = "f32::acosh", reason = "use libm::acoshf" },
    { path = "f32::atanh", reason = "use libm::atanhf" },
]
