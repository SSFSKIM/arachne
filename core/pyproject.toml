[build-system]
# Pinned, as the toolchain is (rust-toolchain.toml): how the core is compiled and packaged is fixed.
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "arachne-core"
description = "Arachne's CPU core: draws frames described in XF, the Frame IR"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]

[tool.maturin]
python-source = "python"
module-name = "arachne_core._core"
features = ["python"]
# Build from Cargo.lock as committed: a lock that does not match Cargo.toml fails the build rather
# than being rewritten from the registry (a PEP 517 build passes no --locked of its own).
locked = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
