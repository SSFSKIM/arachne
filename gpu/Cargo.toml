[package]
name = "arachne-gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Arachne's GPU build: stacks pictures as layers on a GPU and reads the frame back"
repository = "https://github.com/SSFSKIM/arachne"
publish = false

[lib]
name = "arachne_gpu"
crate-type = ["cdylib", "rlib"]

[features]
# The Python extension (built by maturin through pyproject.toml). Off for `cargo test`, which links
# no Python.
python = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]
# The frame set and the read-back benchmark (src/bench/, examples/): tools that measure this
# build on a GPU host. The wheel never has them.
bench = []

[dependencies]
# Vulkan only, through the system's loader at run time (never linked at build time). The exact
# version is the pin's `wgpu` field (build.rs reads it from Cargo.lock).
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "vulkan", "wgsl"] }
pollster = "1.0.3"
bytemuck = { version = "1.25", features = ["derive"] }
# Content keys: BLAKE2b with a 16-byte digest, as the Frame IR's.
blake2b_simd = "1.0.3"
pyo3 = { version = "0.30.1", optional = true, features = ["abi3-py312"] }
numpy = { version = "0.30.0", optional = true }

[profile.release]
codegen-units = 1
lto = "thin"

[dev-dependencies]
serde_json = "1.0"

[[example]]
name = "frameset"
required-features = ["bench"]

[[example]]
name = "readback_bench"
required-features = ["bench"]
