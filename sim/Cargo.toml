[package]
name = "arachne-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Arachne's simulation crate: rigid-body worlds stepped on a fixed clock"
repository = "https://github.com/SSFSKIM/arachne"
publish = false

[lib]
name = "arachne_sim"
crate-type = ["cdylib", "rlib"]

[features]
# The Python extension (built by maturin through pyproject.toml). Off for `cargo test`, which links
# no Python.
python = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
# The solver, pinned by exact version, its features listed one by one, without `std` (README.md,
# "Determinism").
rapier2d = { version = "=0.36.1", default-features = false, features = [
    "dim2",
    "f32",
    "alloc",
    "block-solver",
    "enhanced-determinism",
] }
rapier3d = { version = "=0.36.1", default-features = false, features = [
    "dim3",
    "f32",
    "alloc",
    "enhanced-determinism",
] }
# The crate's own transcendental functions, in pure Rust (clippy.toml): the same as the solver's.
libm = "0.2.16"
pyo3 = { version = "0.30.1", optional = true, features = ["abi3-py312"] }

[dev-dependencies]
# The probe's digests.
sha2 = "0.11.1"

# The solver's calls to the platform's maths, routed through simba's traits (and so through the
# pure-Rust libm under `enhanced-determinism`): upstream's fix commits, vendored under vendor/
# (vendor/VENDORED.md; README.md, "Determinism"). ci/tree_check.py fails if one of these resolves
# from anywhere else.
[patch.crates-io]
rapier2d = { path = "vendor/rapier/crates/rapier2d" }
rapier3d = { path = "vendor/rapier/crates/rapier3d" }
parry2d = { path = "vendor/parry/crates/parry2d" }
parry3d = { path = "vendor/parry/crates/parry3d" }
glamx = { path = "vendor/glamx" }

[profile.release]
codegen-units = 1
lto = "thin"

# The release build with line tables, for ci/imports.py --where.
[profile.audit]
inherits = "release"
debug = "line-tables-only"
