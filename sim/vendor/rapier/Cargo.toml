# Modified by the Arachne authors: this manifest is trimmed from upstream's at the commit
# sim/vendor/VENDORED.md names, to what Arachne's build compiles (that file lists the changes).

[workspace]
members = ["crates/rapier2d", "crates/rapier3d"]
resolver = "2"

[workspace.package]
version = "0.36.1"
authors = ["Sébastien Crozet <sebcrozet@dimforge.com>"]
homepage = "https://rapier.rs"
repository = "https://github.com/dimforge/rapier"
categories = [
    "science",
    "game-development",
    "mathematics",
    "simulation",
    "wasm",
]
license = "Apache-2.0"
rust-version = "1.86"
edition = "2024"

[workspace.lints.clippy]
needless_lifetimes = "allow"

[workspace.dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["macros"] }
glamx = { version = "0.3.1", default-features = false }
simba = { version = "0.10.2", default-features = false }
num-traits = { version = "0.2", default-features = false }
approx = { version = "0.5", default-features = false }

parry2d = { version = "0.31.1", default-features = false, features = ["required-features"] }
parry3d = { version = "0.31.1", default-features = false, features = ["required-features"] }

arrayvec = { version = "0.7", default-features = false }
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
thiserror = { version = "2", default-features = false }
profiling = "1.0"
static_assertions = "1"
wide = { version = "1", default-features = false }

web-time = "1.1"
rayon = "1"
serde = { version = "1", default-features = false, features = ["derive"] }
